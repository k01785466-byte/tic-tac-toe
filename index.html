<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Casino Drop</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg-base: #121212;
  --bg-panel: #1a1a1a;
  --bg-card: #222222;
  --bg-hover: #2c2c2c;
  
  --text-main: #f5f5f5;
  --text-muted: #888888;
  
  --accent-silver: #d4d4d4;
  --accent-white: #ffffff;
  --accent-green: #10b981;
  
  --border: #333333;
  --border-light: #444444;
  
  --shadow-sm: 0 2px 4px rgba(0,0,0,0.5);
  --shadow-md: 0 10px 20px rgba(0,0,0,0.6);
  --shadow-float: 0 20px 40px rgba(0,0,0,0.8);

  --reel-h: 100px;
  --sidebar-w: 240px;
}

* {
  margin: 0; padding: 0; box-sizing: border-box;
  font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; -ms-overflow-style: none; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg-base); color: var(--text-main);
  background-image: radial-gradient(circle at 50% 0%, #1e1e1e 0%, #121212 70%);
}

body.no-anim *, body.no-anim *::before, body.no-anim *::after {
  animation: none !important; transition: none !important;
}

.app-container { display: flex; width: 100%; height: 100%; position: relative; }

/* ============ ЛЕВОЕ МЕНЮ (ПК) ============ */
.sidebar {
  width: var(--sidebar-w); background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 25px 20px;
  gap: 10px; flex-shrink: 0; z-index: 100;
  height: 100%;
}

.sidebar-logo { 
  display: flex; align-items: center; gap: 15px;
  font-size: 20px; font-weight: 900; color: #fff;
  margin-bottom: 30px; padding-left: 10px; cursor: pointer;
}
.sidebar-logo img { width: 36px; height: 36px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }

.nav-btn { 
  width: 100%; height: 50px; border-radius: 12px; 
  background: transparent; border: 1px solid transparent; 
  color: var(--text-muted); font-size: 16px; font-weight: 600; cursor: pointer; 
  transition: all 0.2s ease; display: flex; align-items: center; 
  gap: 15px; padding: 0 15px;
}
.nav-btn i { font-size: 22px; }
.nav-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
.nav-btn.active { 
  background: var(--bg-card); color: var(--accent-white); 
  border-color: var(--border-light); 
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}

/* ============ ВЕРХНЯЯ ПАНЕЛЬ ============ */
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; position: relative; }

.topbar {
  height: 72px; background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 30px; flex-shrink: 0; z-index: 90;
}

.topbar-left { display: flex; align-items: center; }
.topbar-title { font-size: 20px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
.topbar-title i { color: var(--accent-silver); font-size: 24px; }

.topbar-right { display: flex; align-items: center; gap: 15px; }
.balance-box {
  background: var(--bg-card); border: 1px solid var(--border-light);
  padding: 8px 20px; border-radius: 30px;
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 18px; color: var(--accent-green);
  font-family: 'Courier New', monospace;
  transition: all 0.3s ease; cursor: pointer;
  white-space: nowrap;
}
.balance-box:hover { transform: translateY(-2px); border-color: var(--accent-green); }
.balance-box img { width: 22px; height: 22px; object-fit: contain; }
.avatar-btn { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--accent-silver); cursor: pointer; object-fit: cover; background: #000; }

/* ============ НИЖНЕЕ МЕНЮ (МОБИЛКИ) ============ */
.mobile-nav {
  display: none; 
  position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
  background: rgba(26, 26, 26, 0.95); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border); z-index: 1000;
  justify-content: space-around; align-items: center;
  padding-bottom: env(safe-area-inset-bottom);
}
.mobile-nav .nav-btn {
  width: 60px; height: 60px; flex-direction: column; justify-content: center; gap: 4px; padding: 0;
  font-size: 10px; border-radius: 12px;
}
.mobile-nav .nav-btn i { font-size: 24px; }
.mobile-nav .nav-btn.active { background: transparent; box-shadow: none; border: none; color: var(--accent-white); }
.mobile-nav .nav-btn.active::after {
  content: ''; position: absolute; bottom: 5px; width: 20px; height: 3px;
  background: var(--accent-white); border-radius: 2px;
}

/* ============ КОНТЕНТ ============ */
.scroll-area { flex: 1; overflow-y: auto; padding: 30px; padding-bottom: 100px; scroll-behavior: smooth; }
.tab-panel { display: none; animation: fadeIn 0.4s ease; }
.tab-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Баннер MEGA JACKPOT */
.hero-banner { 
  width: 100%; min-height: 200px; 
  border-radius: 24px; overflow: hidden; position: relative; 
  margin-bottom: 30px; border: 1px solid var(--border); 
  background-image: linear-gradient(135deg, rgba(18,18,18,0.85) 0%, rgba(18,18,18,0.6) 100%), url('https://images.pexels.com/photos/29825629/pexels-photo-29825629.jpeg?auto=compress&cs=tinysrgb&w=1200'); 
  background-size: cover; background-position: center; 
  box-shadow: var(--shadow-md); display: flex; align-items: center; padding: 40px; 
}
.hero-overlay { position: relative; z-index: 2; max-width: 500px; }
.hero-title { font-size: 36px; font-weight: 900; color: #fff; margin-bottom: 10px; }
.hero-title span { color: var(--accent-silver); }
.hero-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
.hero-btn { 
  background: var(--accent-white); color: #000; border: none; padding: 12px 28px; 
  font-size: 14px; font-weight: 800; border-radius: 12px; cursor: pointer; 
  transition: 0.3s; text-transform: uppercase; display: flex; align-items: center; gap: 10px; 
}
.hero-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,255,255,0.3); }
.hero-btn img { width: 20px; height: 20px; }

/* Сетка слотов */
.category-section { margin-bottom: 40px; }
.section-title { font-size: 22px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.section-title i { color: var(--accent-silver); font-size: 26px; }
.machine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }

.machine-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.3s ease; position: relative; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }
.machine-card:hover { transform: translateY(-5px); border-color: var(--border-light); box-shadow: 0 15px 30px rgba(0,0,0,0.6); z-index: 10; }
.mc-visual { width: 100%; height: 140px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #2c2c2c 0%, #1a1a1a 100%); padding: 25px; }
.mc-visual img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s ease; }
.machine-card:hover .mc-visual img { transform: scale(1.1); }
.mc-info { padding: 15px; display: flex; flex-direction: column; align-items: center; border-top: 1px solid var(--border); }
.mc-name { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 4px; text-align: center; }
.mc-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase; }
.mc-play-btn { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-weight: 700; font-size: 13px; text-align: center; transition: 0.3s; }
.machine-card:hover .mc-play-btn { background: #fff; color: #000; border-color: #fff; }

/* ============ ИГРОВОЙ ЭКРАН ============ */
#game-screen { position: fixed; inset: 0; z-index: 5000; background: var(--bg-base); display: none; flex-direction: column; }
#game-screen.active { display: flex; }
.game-header { height: 72px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
.back-btn, .info-btn { background: var(--bg-card); border: 1px solid var(--border); padding: 10px 20px; border-radius: 10px; color: var(--text-muted); font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
.back-btn:hover, .info-btn:hover { color: #fff; border-color: #fff; }
.game-bal { font-family: 'Courier New', monospace; font-size: 20px; font-weight: 800; color: var(--accent-green); }

.game-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
.slot-box { width: 100%; max-width: 600px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 24px; padding: 35px; box-shadow: var(--shadow-float); position: relative; }

.reels-container { background: #0a0a0a; padding: 15px; border-radius: 16px; border: 1px solid #222; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; position: relative; }
.reel-window { height: var(--reel-h); background: #111; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid #333; z-index: 2; }
.reel-strip { position: absolute; top: 0; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; transition: transform 0.4s ease; }
.reel-item { height: var(--reel-h); width: 100%; display: flex; align-items: center; justify-content: center; padding: 15%; }
.reel-item img { width: 100%; height: 100%; object-fit: contain; }
.reel-strip.spinning { animation: spinBlur 0.15s linear infinite; filter: blur(4px); }
@keyframes spinBlur { 0% { transform: translateY(-100%); } 100% { transform: translateY(0); } }

.win-line { stroke: var(--accent-green); stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 8px var(--accent-green)); animation: drawLine 0.6s ease forwards; }
@keyframes drawLine { from { stroke-dasharray: 1000; stroke-dashoffset: 1000; } to { stroke-dasharray: 1000; stroke-dashoffset: 0; } }
.reel-window.winning { border-color: var(--accent-green); box-shadow: 0 0 20px var(--accent-green); z-index: 2; }

.controls { background: #0a0a0a; border: 1px solid var(--border); border-radius: 16px; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
.bet-input { display: flex; align-items: center; gap: 8px; }
.bet-input img { width: 20px; height: 20px; }
.bet-input span { color: var(--text-muted); font-size: 14px; font-weight: 600; }
.bet-input input { width: 90px; background: transparent; border: none; color: #fff; font-family: 'Courier New', monospace; font-size: 18px; font-weight: 800; outline: none; text-align: right; }
.bet-btns { display: flex; gap: 8px; }
.bet-btns button { background: var(--bg-card); border: 1px solid var(--border); color: #fff; padding: 10px 15px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s; }
.bet-btns button:hover { background: var(--bg-hover); }
.bet-btns button.max { background: #fff; color: #000; border: none; }

.action-buttons { display: flex; }
.spin-btn { width: 100%; padding: 22px; background: #ffffff; color: #000; font-size: 22px; font-weight: 900; letter-spacing: 2px; border: none; border-radius: 16px; cursor: pointer; transition: 0.2s; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 12px; }
.spin-btn img { width: 32px; height: 32px; }
.spin-btn:hover:not(:disabled) { transform: translateY(-2px); background: #eee; }
.spin-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #555; }

/* ============ ПАНЕЛИ ============ */
.panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px; padding: 30px; max-width: 600px; margin: 0 auto; }
.panel-title { font-size: 22px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; color: #fff; }
.prof-head { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; background: var(--bg-panel); padding: 20px; border-radius: 20px; border: 1px solid var(--border); }
.prof-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-silver); background: #000; }
.prof-info h3 { font-size: 24px; margin-bottom: 5px; font-weight: 800; color: #fff; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.stat-box { 
  background: var(--bg-panel); padding: 20px; border-radius: 16px; 
  border: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; 
  min-width: 0;
}
.stat-lbl { font-size: 13px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
.stat-val { 
  font-size: 22px; font-weight: 900; color: #fff; 
  word-break: break-all;
  line-height: 1.2;
}

/* Топ */
.top-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 10px; }
.top-item.self { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.05); }
.top-rank { font-weight: 900; color: var(--text-muted); width: 30px; font-size: 18px; }
.top-name { flex: 1; font-weight: 700; font-size: 16px; color: #fff; }
.top-bal { font-family: 'Courier New', monospace; color: var(--accent-green); font-weight: 800; font-size: 16px; }

/* Окна */
.window-overlay { position: fixed; inset: 0; z-index: 10000; display: none; background: rgba(0,0,0,0.6); }
.window-overlay.active { display: block; }
.floating-window { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); background: var(--bg-panel); border: 1px solid var(--border-light); border-radius: 20px; width: 90%; max-width: 450px; display: flex; flex-direction: column; max-height: 80vh; }
.window-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.window-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
.window-body { padding: 20px; overflow-y: auto; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-box { background: var(--bg-card); border: 1px solid var(--border-light); width: 90%; max-width: 400px; border-radius: 24px; padding: 30px; }
.inp { width: 100%; padding: 14px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 15px; outline: none; }
.btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; border: none; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-green { background: var(--accent-green); color: #000; }
.btn-gray { background: var(--bg-hover); color: #fff; border: 1px solid var(--border); }

.win-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10005; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.win-popup.active { opacity: 1; pointer-events: auto; }
.win-box { background: var(--bg-panel); border: 2px solid var(--accent-white); width: 90%; max-width: 350px; border-radius: 24px; overflow: hidden; transform: scale(0.8); transition: transform 0.4s; text-align: center; }
.win-popup.active .win-box { transform: scale(1); }
.win-title { background: var(--accent-white); color: #000; font-weight: 900; padding: 20px; font-size: 22px; }
.win-amount { padding: 40px 30px; font-size: 44px; font-weight: 900; font-family: 'Courier New', monospace; color: #fff; }

.bottom-bar { position: fixed; bottom: -100px; left: 0; width: 100%; background: var(--accent-white); color: #000; padding: 15px; text-align: center; font-size: 22px; font-weight: 900; z-index: 10010; transition: bottom 0.4s; }
.bottom-bar.active { bottom: 0; }

/* ============ АДАПТИВ ============ */
@media (max-width: 1024px) {
  :root { --sidebar-w: 80px; }
  .sidebar { padding: 20px 10px; align-items: center; }
  .sidebar-logo span { display: none; }
  .nav-btn span { display: none; }
  .nav-btn { justify-content: center; padding: 0; }
}

@media (max-width: 768px) {
  :root { --reel-h: 80px; }
  
  .sidebar { display: none; }
  .mobile-nav { display: flex; }
  
  .topbar { padding: 0 15px; height: 60px; }
  .topbar-title { font-size: 16px; }
  .main-content { padding-bottom: 70px; }
  
  .hero-banner { min-height: 160px; height: auto; padding: 20px; flex-direction: column; align-items: flex-start; justify-content: center; }
  .hero-title { font-size: 24px; }
  .hero-desc { font-size: 13px; margin-bottom: 15px; }
  .hero-btn { padding: 10px 20px; font-size: 13px; }
  
  .machine-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .mc-visual { height: 100px; padding: 15px; }
  .mc-name { font-size: 14px; }
  
  .slot-box { padding: 15px; }
  .controls { flex-direction: column; gap: 12px; }
  .bet-input { width: 100%; justify-content: flex-start; }
  .bet-input input { text-align: right; flex: 1; }
  .bet-btns { width: 100%; }
  .bet-btns button { flex: 1; }
  
  .spin-btn { font-size: 18px; padding: 18px; }
  .spin-btn img { width: 26px; height: 26px; }
  
  .floating-window { top: 70px; width: 95%; max-width: 400px; }
  
  .stats-grid { grid-template-columns: 1fr; gap: 10px; }
  .stat-box { padding: 15px; }
  .stat-val { font-size: 18px; }
}

@media (max-width: 480px) {
  :root { --reel-h: 65px; }
  .slot-box { padding: 10px; }
  .reels-container { gap: 6px; padding: 10px; }
  .reel-item { padding: 10%; }
  .bet-input input { font-size: 16px; }
  .spin-btn { padding: 15px; font-size: 16px; gap: 8px; }
  .spin-btn img { width: 22px; height: 22px; }
  .mc-visual { height: 90px; }
  .topbar-title { font-size: 14px; }
  .balance-box { font-size: 14px; padding: 6px 12px; }
  .balance-box img { width: 18px; height: 18px; }
}
</style>
</head>
<body>

<div class="app-container" id="lobby-view">
  
  <aside class="sidebar">
    <div class="sidebar-logo" onclick="showTab('lobby')">
      <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Gem%20stone/3D/gem_stone_3d.png" alt="Logo">
      <span>CASINO DROP</span>
    </div>
    
    <button class="nav-btn active" data-tab="lobby" onclick="showTab('lobby')">
      <i class="ph-bold ph-squares-four"></i><span>Лобби</span>
    </button>
    <button class="nav-btn" data-tab="top" onclick="showTab('top')">
      <i class="ph-bold ph-trophy"></i><span>Топ игроков</span>
    </button>
    <button class="nav-btn" data-tab="profile" onclick="showTab('profile')">
      <i class="ph-bold ph-user-circle"></i><span>Профиль</span>
    </button>
    <button class="nav-btn" data-tab="settings" onclick="showTab('settings')">
      <i class="ph-bold ph-gear"></i><span>Настройки</span>
    </button>
    <button class="nav-btn" onclick="toggleWindow('history-window')">
      <i class="ph-bold ph-clock-counter-clockwise"></i><span>История</span>
    </button>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">
          <i class="ph-bold ph-crown"></i> CASINO DROP
        </div>
      </div>
      
      <div class="topbar-right">
        <div class="balance-box" onclick="openEditModal()">
          <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Money%20bag/3D/money_bag_3d.png" alt="Wallet">
          <span id="ui-balance">1000.00</span>
        </div>
        <img id="ui-avatar-top" class="avatar-btn" src="" onerror="this.src='https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Smiling%20face%20with%20sunglasses/3D/smiling_face_with_sunglasses_3d.png'">
      </div>
    </header>

    <div class="scroll-area" id="main-scroll-area">
      <div class="tab-panel active" id="tab-lobby">
        
        <div class="hero-banner">
          <div class="hero-overlay">
            <div class="hero-title">MEGA <span>JACKPOT</span></div>
            <div class="hero-desc">Испытай удачу на наших эксклюзивных автоматах. Выиграй до 5 000 000 ₽ прямо сейчас!</div>
            <button class="hero-btn" onclick="claimGift()" id="btn-claim-gift">
              <img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Wrapped%20gift/3D/wrapped_gift_3d.png" alt="Gift">
              Забрать бонус
            </button>
            <div id="gift-timer" style="margin-top:15px; font-size:13px; color:var(--text-muted); font-weight:700;"></div>
          </div>
        </div>
        
        <div id="machine-categories"></div>
      </div>

      <div class="tab-panel" id="tab-top">
        <div class="panel">
          <div class="panel-title"><i class="ph-bold ph-trophy"></i> Топ игроков</div>
          <div id="top-list"></div>

function getIconUrl(emoji) {
  if (ICON_MAP[emoji]) return ICON_MAP[emoji];
  try {
    const code = twemoji.convert.toCodePoint(emoji);
    return `https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.3/assets/svg/${code}.svg`;
  } catch (e) { return null; }
}

// ============ СОСТОЯНИЕ ============
const state = {
  playerId: localStorage.getItem('casino_player_id') || 'player_' + Math.random().toString(36).substr(2, 9),
  balance: parseFloat(localStorage.getItem('tl_balance')) || 1000,
  bet: 100,
  avatar: localStorage.getItem('tl_avatar') || '',
  nickname: localStorage.getItem('tl_nickname') || 'Игрок',
  sound: localStorage.getItem('tl_sound') !== 'false',
  noAnim: localStorage.getItem('tl_no_anim') === 'true',
  lastGift: parseInt(localStorage.getItem('tl_last_gift')) || 0,
  history: JSON.parse(localStorage.getItem('tl_history')) || [],
  stats: { spins: 0, won: 0, maxWin: 0, totalBet: 0 }
};
localStorage.setItem('casino_player_id', state.playerId);

try {
  const savedStats = JSON.parse(localStorage.getItem('tl_stats'));
  if (savedStats) {
    state.stats.spins = parseInt(savedStats.spins) || 0;
    state.stats.won = parseFloat(savedStats.won) || 0;
    state.stats.maxWin = parseFloat(savedStats.maxWin) || 0;
    state.stats.totalBet = parseFloat(savedStats.totalBet) || 0;
  }
} catch(e) {}

let currentMachine = null, isSpinning = false, audioCtx = null, bottomBarTimer = null;
if (state.noAnim) document.body.classList.add('no-anim');

window.toggleWindow = (id) => {
  const win = document.getElementById(id);
  win.classList.toggle('active');
  if (id === 'history-window' && win.classList.contains('active')) renderHistory();
};

// ============ СЕРВЕР ============
async function saveToServer() {
  try {
    localStorage.setItem('tl_balance', state.balance);
    localStorage.setItem('tl_nickname', state.nickname);
    localStorage.setItem('tl_avatar', state.avatar);
    localStorage.setItem('tl_stats', JSON.stringify(state.stats));
    localStorage.setItem('tl_history', JSON.stringify(state.history));
  } catch (e) {}
  try {
    await fetch('/api/save.php', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_id: state.playerId, balance: state.balance, nickname: state.nickname, avatar_url: state.avatar, stats: state.stats })
    });
  } catch (e) {}
}

// ============ НАВИГАЦИЯ ============
function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  
  document.querySelectorAll(`.nav-btn[data-tab="${name}"]`).forEach(b => b.classList.add('active'));
  
  if (name === 'top') loadTop();
  if (name === 'profile') updateProfileUI();
}

// ============ ЛОББИ ============
function renderLobby() {
  const container = document.getElementById('machine-categories');
  container.innerHTML = CATEGORIES.map(cat => {
    const catMachines = cat.machines.map(id => MACHINES.find(m => m.id === id)).filter(Boolean);
    return `
      <div class="category-section">
        <div class="section-title">
          <i class="ph-bold ${cat.icon}"></i>
          ${cat.title}
        </div>
        <div class="machine-grid">
          ${catMachines.map(m => {
            const firstSymbol = m.symbols[0];
            const iconUrl = getIconUrl(firstSymbol);
            const visualContent = iconUrl 
              ? `<img src="${iconUrl}" alt="${m.name}" loading="lazy" onerror="this.outerHTML='<div style=\\'font-size:50px;\\'>${firstSymbol}</div>'">`
              : `<div style="font-size:50px;">${firstSymbol}</div>`;
            return `
              <div class="machine-card" onclick="openMachine('${m.id}')">
                <div class="mc-visual">${visualContent}</div>
                <div class="mc-info">
                  <div class="mc-name">${m.name}</div>
                  <div class="mc-desc">${m.desc}</div>
                  <div class="mc-play-btn">ИГРАТЬ</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// ============ ТОП ============
async function loadTop() {
  const list = document.getElementById('top-list');
  list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Загрузка...</div>';
  
  try {
    const res = await fetch('/api/leaderboard.php');
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) {
      renderTop(data);
    } else {
      list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Пусто</div>';
    }
  } catch (e) {
    let fake = [
      { nickname: 'Whale', balance: state.balance * 5 + 1000000 },
      { nickname: 'CryptoKing', balance: state.balance * 3 + 500000 },
      { nickname: 'Lucky', balance: state.balance * 2 + 100000 },
      { nickname: state.nickname, balance: state.balance, player_id: state.playerId }
    ];
    renderTop(fake);
  }
}

function renderTop(players) {
  const list = document.getElementById('top-list');
  players.sort((a, b) => (parseFloat(b.balance) || 0) - (parseFloat(a.balance) || 0));
  
  list.innerHTML = players.map((p, i) => {
    const isSelf = p.player_id === state.playerId;
    return `
      <div class="top-item ${isSelf ? 'self' : ''}">
        <div class="top-rank">#${i+1}</div>
        <div class="top-name">${p.nickname || 'Игрок'}${isSelf ? ' (Вы)' : ''}</div>
        <div class="top-bal">${Math.floor(p.balance).toLocaleString('ru-RU')} ₽</div>
      </div>
    `;
  }).join('');
}

// ============ ПРОФИЛЬ ============
function updateProfileUI() {
  document.getElementById('ui-nick').textContent = state.nickname;
  const src = state.avatar || 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Smiling%20face%20with%20sunglasses/3D/smiling_face_with_sunglasses_3d.png';
  document.getElementById('ui-avatar').src = src;
  document.getElementById('ui-avatar-top').src = src;
  
  const s = state.stats;
  document.getElementById('stat-spins').textContent = s.spins;
  document.getElementById('stat-won').textContent = Math.floor(s.won).toLocaleString('ru-RU');
  document.getElementById('stat-max').textContent = Math.floor(s.maxWin).toLocaleString('ru-RU');
  let wr = s.totalBet > 0 ? Math.floor((s.won / s.totalBet) * 100) : 0;
  document.getElementById('stat-winrate').textContent = wr + '%';
}

window.openEditModal = () => {
  document.getElementById('input-nick').value = state.nickname;
  document.getElementById('edit-modal').classList.add('active');
};
window.saveProfile = () => {
  const v = document.getElementById('input-nick').value.trim();
  if (v) { state.nickname = v; saveToServer(); updateProfileUI(); updateUI(); }
  document.getElementById('edit-modal').classList.remove('active');
};
document.getElementById('upload-avatar').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 1.5 * 1024 * 1024) return alert('Файл слишком большой! Максимум 1.5 МБ.');
  const rd = new FileReader();
  rd.onload = (ev) => { state.avatar = ev.target.result; saveToServer(); updateProfileUI(); };
  rd.readAsDataURL(f);
});

    const iconUrl = getIconUrl(sym);
    const img = iconUrl ? `<img src="${iconUrl}" style="width:40px; height:40px;">` : `<span style="font-size:24px;">${sym}</span>`;
    return `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);">
        <div>${img}</div>
        <div style="display:flex; gap:20px; text-align:right;">
          <div><div style="font-size:10px; color:var(--text-muted);">x2</div><div style="font-family:'Courier New'; font-weight:800; color:var(--accent-green);">${currentMachine.pair[i]}</div></div>
          <div><div style="font-size:10px; color:var(--text-muted);">x3</div><div style="font-family:'Courier New'; font-weight:800; color:#fff;">${currentMachine.triple[i]}</div></div>
        </div>
      </div>
    `;
  }).join('');
  toggleWindow('paytable-window');
};

// ============ ИСТОРИЯ ============
function renderHistory() {
  const list = document.getElementById('history-list');
  if (!state.history || state.history.length === 0) {
    list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Пока нет выигрышей</div>';
    return;
  }
  list.innerHTML = state.history.map(h => {
    const date = new Date(h.time);
    const timeStr = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
    return `
      <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
        <div><div style="font-weight:800; font-size:14px;">${h.game}</div><div style="font-size:11px; color:var(--text-muted);">${timeStr}</div></div>
        <div style="font-family:'Courier New'; font-weight:900; color:var(--accent-green);">+${h.win.toLocaleString('ru-RU')} ₽</div>
      </div>
    `;
  }).join('');
}
function addHistory(gameName, winAmount) {
  state.history.unshift({ game: gameName, win: winAmount, time: Date.now() });
  if (state.history.length > 50) state.history.pop();
  saveToServer();
}

// ============ ИГРА ============
function openMachine(id) {
  currentMachine = MACHINES.find(m => m.id === id);
  if (!currentMachine) return;
  
  document.getElementById('win-lines-svg').innerHTML = '';
  for(let i=0; i<9; i++) {
    const strip = document.getElementById('reel-strip-' + i);
    const symbol = currentMachine.symbols[i % currentMachine.symbols.length];
    const iconUrl = getIconUrl(symbol);
    const content = iconUrl
      ? `<img src="${iconUrl}" loading="lazy" onerror="this.outerHTML='<div style=\\'font-size:40px;\\'>${symbol}</div>'">`
      : `<div style="font-size:40px;">${symbol}</div>`;
    strip.innerHTML = `<div class="reel-item">${content}</div>`;
    strip.style.transition = 'none'; strip.style.transform = 'translateY(0)'; strip.classList.remove('spinning');
    document.getElementById('reel-win-' + i).classList.remove('winning');
  }
  
  document.getElementById('lobby-view').style.display = 'none';
  document.getElementById('game-screen').classList.add('active');
  updateUI();
}

function closeMachine() {
  document.getElementById('game-screen').classList.remove('active');
  document.getElementById('lobby-view').style.display = 'flex';
  currentMachine = null;
  showTab('lobby');
  updateUI();
}

function updateUI() {
  const fmt = Math.floor(state.balance).toLocaleString('ru-RU');
  document.getElementById('ui-balance').textContent = fmt;
  document.getElementById('game-balance').textContent = fmt;
  if (document.activeElement !== document.getElementById('game-bet')) document.getElementById('game-bet').value = state.bet;
}

window.changeBet = (amt) => {
  if (isSpinning) return;
  state.bet = Math.max(10, Math.min(state.balance, state.bet + amt, 50000));
  document.getElementById('game-bet').value = state.bet;
};
window.maxBet = () => {
  if (isSpinning) return;
  state.bet = Math.min(state.balance, 50000);
  if (state.bet < 10) state.bet = 10;
  document.getElementById('game-bet').value = state.bet;
};
document.getElementById('game-bet').addEventListener('input', (e) => {
  let v = parseFloat(e.target.value);
  if (isNaN(v)) return;
  if (v < 10) v = 10; if (v > state.balance) v = state.balance; if (v > 50000) v = 50000;
  state.bet = v;
});

window.spin = () => {
  if (isSpinning || !currentMachine) return;
  initAudio();
  
  document.getElementById('win-lines-svg').innerHTML = '';
  
  if (state.balance < state.bet) {
    alert('Мало средств!');
    return;
  }
  
  isSpinning = true;
  document.getElementById('btn-spin').disabled = true;
  state.balance -= state.bet;
  state.stats.spins = (parseInt(state.stats.spins) || 0) + 1;
  state.stats.totalBet = (parseFloat(state.stats.totalBet) || 0) + state.bet;
  
  saveToServer(); updateUI();
  
  document.querySelectorAll('.reel-window').forEach(w => w.classList.remove('winning'));
  
  const syms = currentMachine.symbols;
  let result = Array.from({length: 9}, () => syms[Math.floor(Math.random()*syms.length)]);
  // Уменьшили шанс на халявную линию с 5% до 2%
  if (Math.random() < 0.02) { const s = syms[Math.floor(Math.random()*syms.length)]; result[3]=s; result[4]=s; result[5]=s; }

  if (state.noAnim) {
    for(let i=0; i<9; i++) {
      const strip = document.getElementById('reel-strip-' + i);
      const symbol = result[i];
      const iconUrl = getIconUrl(symbol);
      const content = iconUrl
        ? `<img src="${iconUrl}" loading="lazy" onerror="this.outerHTML='<div style=\\'font-size:40px;\\'>${symbol}</div>'">`
        : `<div style="font-size:40px;">${symbol}</div>`;
      strip.innerHTML = `<div class="reel-item">${content}</div>`;
    }
    checkWin(result); return;
  }

  const interval = setInterval(() => playTone(900, 0.04, 'square', 0.04), 100);
  const reelHeight = document.querySelector('.reel-window').offsetHeight;
  
  for (let col = 0; col < 3; col++) {
    const cells = [col, col+3, col+6];
    cells.forEach(idx => {
      const strip = document.getElementById('reel-strip-' + idx);
      let html = '';
      for(let k=0; k<15; k++) {
        const randSym = syms[Math.floor(Math.random()*syms.length)];
        const randUrl = getIconUrl(randSym);
        const content = randUrl
          ? `<img src="${randUrl}" loading="lazy" onerror="this.outerHTML='<div style=\\'font-size:40px;\\'>${randSym}</div>'">`
          : `<div style="font-size:40px;">${randSym}</div>`;
        html += `<div class="reel-item">${content}</div>`;
      }
      const finalSym = result[idx];
      const finalUrl = getIconUrl(finalSym);
      const finalContent = finalUrl
        ? `<img src="${finalUrl}" loading="lazy" onerror="this.outerHTML='<div style=\\'font-size:40px;\\'>${finalSym}</div>'">`
        : `<div style="font-size:40px;">${finalSym}</div>`;
      html += `<div class="reel-item">${finalContent}</div>`;
      
      strip.innerHTML = html;
      strip.style.transition = 'none'; strip.style.transform = 'translateY(0)';
      void strip.offsetWidth; strip.classList.add('spinning');
    });

    setTimeout(() => {
      cells.forEach(idx => {
        const strip = document.getElementById('reel-strip-' + idx);
        strip.classList.remove('spinning');
        strip.style.transition = `transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)`;
        strip.style.transform = `translateY(-${15 * reelHeight}px)`;
      });
      playTone(400, 0.1, 'sine', 0.1);
    }, 800 + col * 300);
  }
  
  setTimeout(() => { clearInterval(interval); checkWin(result); }, 800 + 600 + 400);
};

function checkWin(res) {
  let win = 0; const syms = currentMachine.symbols; let wc = new Set();
  let winningLines = [];
  
  [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].forEach(l => {
    const [a,b,c] = l; const s1=res[a], s2=res[b], s3=res[c];
    
    // Тройка (x3) платит СРАЗУ ОТ СТАВКИ (state.bet), а не от bp = bet/8
    if (s1===s2 && s2===s3) { 
      win += state.bet * currentMachine.triple[syms.indexOf(s1)]; 
      wc.add(a); wc.add(b); wc.add(c); 
      winningLines.push([a,b,c]);
    }
    // Пара (x2) тоже платит от ставки
    else if (s1===s2 || s2===s3 || s1===s3) {
      const sym = s1===s2?s1:(s2===s3?s2:s1);
      win += state.bet * currentMachine.pair[syms.indexOf(sym)];
      if (s1===s2) { wc.add(a); wc.add(b); winningLines.push([a,b]); } 
      else if (s2===s3) { wc.add(b); wc.add(c); winningLines.push([b,c]); } 
      else { wc.add(a); wc.add(c); winningLines.push([a,c]); }
    }
  });
  
  // Snow Jackpot (0.05% шанс теперь, было 0.3%)
  let isSnowJackpot = false;
  if (currentMachine.isWinter && Math.random() < 0.0005) {
    const jackpot = Math.floor(Math.random() * 45000000) + 5000000;
    win += jackpot;
    isSnowJackpot = true;
  }
  
  win = Math.floor(win);
  
  if (win > 0) {
    wc.forEach(i => document.getElementById('reel-win-'+i).classList.add('winning'));
    if (winningLines.length > 0) drawWinLines(winningLines);
    
    state.balance += win;
    state.stats.won = (parseFloat(state.stats.won) || 0) + win;
    if (win > (parseFloat(state.stats.maxWin) || 0)) state.stats.maxWin = win;
    
    addHistory(currentMachine.name, win);
    saveToServer(); updateUI(); updateProfileUI();
    showBottomBar(win);
    
    // "MEGA WIN" теперь только если выигрыш больше 50 ставок (раньше было 5)
    if (isSnowJackpot || win >= state.bet * 50) { showWinPopup('MEGA WIN', win); playMegaWinSound(); }
    else { playWinSound(); }
  } else {
    playTone(300, 0.15, 'sine', 0.08);
  }
  
  isSpinning = false;
  document.getElementById('btn-spin').disabled = false;
}

function drawWinLines(lines) {
  const svg = document.getElementById('win-lines-svg');
  svg.innerHTML = '';
  const containerRect = document.getElementById('main-reels').getBoundingClientRect();
  lines.forEach((line, index) => {
    const startIdx = line[0];
    const endIdx = line[line.length - 1];
    const startEl = document.getElementById(`reel-win-${startIdx}`);
    const endEl = document.getElementById(`reel-win-${endIdx}`);
    if (!startEl || !endEl) return;
    const startRect = startEl.getBoundingClientRect();
    const endRect = endEl.getBoundingClientRect();
    const lineEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    lineEl.setAttribute('x1', startRect.left - containerRect.left + startRect.width / 2);
    lineEl.setAttribute('y1', startRect.top - containerRect.top + startRect.height / 2);
    lineEl.setAttribute('x2', endRect.left - containerRect.left + endRect.width / 2);
    lineEl.setAttribute('y2', endRect.top - containerRect.top + endRect.height / 2);
    lineEl.setAttribute('class', 'win-line');
    lineEl.style.animationDelay = `${index * 0.15}s`;
    svg.appendChild(lineEl);
  });
}

function showBottomBar(amt) {
  const b = document.getElementById('bottom-bar');
  document.getElementById('bottom-bar-amount').textContent = Math.floor(amt).toLocaleString('ru-RU') + ' ₽';
  b.classList.add('active');
  clearTimeout(bottomBarTimer);
  bottomBarTimer = setTimeout(() => b.classList.remove('active'), 3000);
}

function animateValue(obj, start, end, duration) {
  let startTimestamp = null;
  const step = (timestamp) => {
    if (!startTimestamp) startTimestamp = timestamp;
    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
    obj.innerHTML = Math.floor((1 - Math.pow(1 - progress, 4)) * (end - start) + start).toLocaleString('ru-RU') + ' ₽';
    if (progress < 1) window.requestAnimationFrame(step);
  };
  window.requestAnimationFrame(step);
}

function showWinPopup(title, amt) {
  document.getElementById('win-title').textContent = title;
  const amountEl = document.getElementById('win-amount');
  amountEl.textContent = '0 ₽';
  document.getElementById('win-popup').classList.add('active');
  animateValue(amountEl, 0, amt, 1200);
  setTimeout(() => document.getElementById('win-popup').classList.remove('active'), 3500);
}

// ============ ЗВУК ============
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(f, d, t='sine', v=0.1) {
  if (!state.sound || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(v, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + d);
  } catch(e) {}
}
function playWinSound() { [523, 659, 784, 1047].forEach((n, i) => setTimeout(() => playTone(n, 0.2, 'sine', 0.15), i * 90)); }
function playMegaWinSound() { [523, 659, 784, 1047, 1319, 1568, 2093].forEach((n, i) => setTimeout(() => playTone(n, 0.3, 'triangle', 0.2), i * 100)); }

// ============ ПОДАРОК ============
function checkGiftCooldown() {
  const btn = document.getElementById('btn-claim-gift'), tm = document.getElementById('gift-timer');
  if (!btn) return;
  const left = 24*60*60*1000 - (Date.now() - state.lastGift);
  if (left > 0) {
    btn.disabled = true; btn.innerHTML = 'Уже забрано';
    const h = Math.floor(left/3600000), m = Math.floor((left%3600000)/60000);
    tm.textContent = `Доступно через ${h}ч ${m}м`;
  } else {
    btn.disabled = false; 
    btn.innerHTML = `<img src="https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Wrapped%20gift/3D/wrapped_gift_3d.png" alt="Gift"> Забрать бонус`; 
    tm.textContent = '';
  }
}
window.claimGift = () => {
  initAudio();
  if (Date.now() - state.lastGift < 24*60*60*1000) return;
  const r = Math.floor(Math.random() * (5000000 - 5000 + 1)) + 5000;
  state.balance += r; state.lastGift = Date.now();
  localStorage.setItem('tl_last_gift', state.lastGift);
  saveToServer(); updateUI(); checkGiftCooldown();
  showWinPopup('БОНУС', r); playMegaWinSound();
};

// ============ НАСТРОЙКИ ============
window.toggleSound = () => {
  state.sound = !state.sound;
  localStorage.setItem('tl_sound', state.sound);
  document.getElementById('sound-status').textContent = state.sound ? 'ВКЛ' : 'ВЫКЛ';
  document.getElementById('sound-status').style.color = state.sound ? 'var(--accent-green)' : '#ff4444';
};
window.toggleAnimations = () => {
  state.noAnim = !state.noAnim;
  document.body.classList.toggle('no-anim');
  localStorage.setItem('tl_no_anim', state.noAnim);
  document.getElementById('anim-status').textContent = state.noAnim ? 'ВЫКЛ' : 'ВКЛ';
  document.getElementById('anim-status').style.color = state.noAnim ? '#ff4444' : 'var(--accent-green)';
};

// ============ СТАРТ ============
renderLobby();
updateUI();
updateProfileUI();
checkGiftCooldown();
</script>
