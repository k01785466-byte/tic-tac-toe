<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kesug Slots</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='0' fill='%23222'/%3E%3Cpath d='M32 12 L52 32 L32 52 L12 32 Z' fill='%2310b981'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23fbbf24'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
:root {
  --bg-main: #121214;
  --bg-card: #1e1e22;
  --bg-input: #09090b;
  --text-main: #e4e4e7;
  --text-white: #ffffff;
  --text-muted: #8b8b93;
  --border: #2d2d33;
  --accent-green: #10b981;
  --accent-gold: #fbbf24;
  --accent-red: #ef4444;
  --glass-bg: rgba(30, 30, 35, 0.6);
  --glass-border: rgba(255, 255, 255, 0.08);
  --shadow-main: 0 10px 30px rgba(0,0,0,0.5);
  --reel-h: 85px;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
::-webkit-scrollbar { display: none; }
body::before {
  content: '';
  position: fixed;
  inset: -18%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 12% 18%, rgba(16,185,129,.105), transparent 34%),
    radial-gradient(ellipse at 88% 72%, rgba(16,185,129,.065), transparent 32%);
  animation: ambientDrift 18s ease-in-out infinite alternate;
  will-change: transform;
}
body { 
  color: var(--text-main); font-size: 15px; line-height: 1.55; overflow-x: hidden; min-height: 100vh; 
  background-color: var(--bg-main); padding-top: 108px; 
}

/* ═══════ ПАРЯЩАЯ ШАПКА ═══════ */
.top-header { 
  position: fixed; top: 15px; left: 50%; transform: translateX(-50%); 
  width: 94%; max-width: 1180px; z-index: 1000;
}
/* В самом верху панель прозрачная; при прокрутке становится матовым стеклом. */
.header-glass { 
  position: relative; isolation: isolate;
  background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
  border: 1px solid transparent; border-radius: 0; padding: 10px 20px;
  display: flex; justify-content: space-between; align-items: center; box-shadow: none;
  transform: scale(.985);
  transition:
    background-color .38s ease,
    backdrop-filter .38s ease,
    -webkit-backdrop-filter .38s ease,
    border-color .38s ease,
    border-radius .38s ease,
    box-shadow .38s ease,
    padding .38s ease,
    transform .38s cubic-bezier(.2,.75,.25,1);
}
/* Два декоративных слоя: скользящий блик и мягкое зелёное свечение стекла. */
.header-glass::before,
.header-glass::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none; z-index: 0; opacity: 0;
}
.header-glass::before {
  inset: -1px;
  background: linear-gradient(108deg, transparent 28%, rgba(255,255,255,.025) 39%, rgba(255,255,255,.15) 48%, rgba(16,185,129,.13) 53%, transparent 66%);
  transform: translateX(-135%) skewX(-16deg);
}
.header-glass::after {
  background:
    radial-gradient(ellipse at 0% 0%, rgba(16,185,129,.16), transparent 42%),
    radial-gradient(ellipse at 100% 100%, rgba(16,185,129,.10), transparent 42%);
}
.header-glass > * { position: relative; z-index: 1; }
.top-header.is-scrolled .header-glass {
  background: var(--glass-bg);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-color: var(--glass-border); border-radius: 50px;
  box-shadow: 0 12px 34px rgba(0,0,0,.42), 0 0 0 1px rgba(16,185,129,.035), inset 0 1px 0 rgba(255,255,255,.10);
  transform: scale(1);
  animation: headerSettle .68s cubic-bezier(.18,.82,.24,1) both;
}
.top-header.is-scrolled .header-glass::before {
  opacity: 1; animation: headerGlassSweep 7.2s ease-in-out 0.25s infinite;
}
.top-header.is-scrolled .header-glass::after {
  opacity: 1; animation: headerGlassGlow 4.8s ease-in-out infinite alternate;
}
.top-header.is-scrolled .top-brand i { animation: headerLogoGlow 3.2s ease-in-out infinite; }
.top-header.is-scrolled .user-balance { position: relative; overflow: hidden; }
.top-header.is-scrolled .user-balance::after {
  content: ''; position: absolute; z-index: 0; top: -35%; bottom: -35%; left: -55%; width: 34%;
  pointer-events: none; transform: skewX(-18deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
  animation: headerBalanceShine 5.5s ease-in-out 1s infinite;
}
.top-header.is-scrolled .profile-btn {
  box-shadow: 0 0 0 3px rgba(16,185,129,.055), 0 0 18px rgba(16,185,129,.10);
  animation: headerAvatarHalo 4s ease-in-out infinite;
}
.top-brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: var(--text-white); cursor: pointer; transition: 0.3s; }
.top-brand:hover { transform: scale(1.02); text-shadow: 0 0 15px rgba(16,185,129,0.5); }
.top-brand i { color: var(--accent-green); font-size: 25px; filter: drop-shadow(0 0 9px rgba(16,185,129,.45)); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.top-brand:hover i { transform: rotate(-12deg) scale(1.16); }

.header-right { display: flex; align-items: center; gap: 12px; }
.user-balance { 
  display: flex; align-items: center; gap: 8px; font-family: monospace; font-size: 18px; font-weight: 800; 
  color: var(--accent-green); padding: 9px 18px; background: rgba(16, 185, 129, 0.1); border-radius: 30px; border: 1px solid rgba(16, 185, 129, 0.2);
}
.user-balance img { width: 21px; transition: transform .35s ease; }
.user-balance:hover img { transform: translateY(-3px) rotate(-8deg); }
.user-balance.balance-pop { animation: balancePop .48s cubic-bezier(.2,.8,.2,1); }

.profile-btn { 
  background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); width: 48px; height: 48px; border-radius: 50%; 
  cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; padding: 0;
}
.profile-btn:hover { border-color: var(--accent-green); background: rgba(255,255,255,0.1); }
.profile-btn img { width: 39px; height: 39px; border-radius: 50%; object-fit: cover; transition: transform .45s cubic-bezier(.2,.8,.2,1), filter .35s ease; }
.profile-btn:hover img { transform: rotate(8deg) scale(1.08); filter: saturate(1.2); }

/* ═══════ КОНТЕНТ ═══════ */
.content-wrapper { width: 100%; max-width: 1200px; margin: 0 auto; padding: 28px 18px 60px 18px; }

/* СЕТКА ИГР */
.games-grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
  gap: 20px; 
}
.game-card { 
  position: relative; isolation: isolate; overflow: hidden;
  background: linear-gradient(145deg, rgba(34,34,39,.98), rgba(25,25,29,.98)); border: 1px solid var(--border); 
  padding: 26px 20px; text-align: center; cursor: pointer; border-radius: 18px; min-height: 310px; 
  display: flex; flex-direction: column; align-items: center;
  transition: transform .38s cubic-bezier(.2,.8,.2,1), border-color .3s ease, box-shadow .38s ease, background .3s ease;
  opacity: 0; animation: cardEnter .68s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: var(--card-delay, 0ms);
}
.game-card::before {
  content: ''; position: absolute; inset: -1px; z-index: -1; pointer-events: none;
  opacity: 0; background: radial-gradient(circle at 50% 0%, rgba(16,185,129,.18), transparent 66%);
  transition: opacity .4s ease;
}
.game-card::after {
  content: ''; position: absolute; top: 0; left: -130%; width: 75%; height: 100%; pointer-events: none;
  transform: skewX(-18deg); opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.055), transparent);
}
.game-card:hover { border-color: rgba(16,185,129,.75); transform: translateY(-8px) scale(1.012); box-shadow: 0 18px 34px rgba(0,0,0,.38), 0 0 24px rgba(16,185,129,.10); }
.game-card:hover::before { opacity: 1; }
.game-card:hover::after { opacity: 1; animation: cardSheen .8s ease; }
.game-icon { width: 76px; height: 76px; margin-bottom: 16px; object-fit: contain; filter: drop-shadow(0 5px 8px rgba(0,0,0,.48)); transition: transform .45s cubic-bezier(.2,.8,.2,1), filter .45s ease; }
.game-card:hover .game-icon { transform: translateY(-5px) scale(1.13) rotate(-3deg); filter: drop-shadow(0 9px 12px rgba(16,185,129,.22)); }
.game-title { font-size: 17px; font-weight: 700; color: var(--text-white); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.game-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.play-btn { position: relative; overflow: hidden; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 13px; font-size: 14px; font-weight: 700; text-transform: uppercase; width: 100%; border-radius: 9px; transition: background .28s ease, color .28s ease, border-color .28s ease, transform .28s ease, box-shadow .28s ease; }
.play-btn::after { content: ''; position: absolute; inset: 0; transform: translateX(-120%); background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent); }
.game-card:hover .play-btn::after { animation: buttonSheen .7s ease; }
.game-card:hover .play-btn { background: var(--accent-green); color: #000; border-color: var(--accent-green); box-shadow: 0 5px 16px rgba(16,185,129,.2); transform: translateY(-1px); }

/* ПРОФИЛЬ */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.back-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
.back-btn:hover { background: var(--border); color: #fff; transform: translateX(-2px); }

.profile-card { display: flex; align-items: center; gap: 20px; background: linear-gradient(135deg, rgba(31,31,36,.98), rgba(24,24,28,.98)); border: 1px solid var(--border); padding: 20px; border-radius: 16px; margin-bottom: 20px; animation: panelRise .6s cubic-bezier(.2,.8,.2,1) both; }
.profile-avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--accent-green); object-fit: cover; background: #000; box-shadow: 0 0 0 5px rgba(16,185,129,.08), 0 0 24px rgba(16,185,129,.12); transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s ease; }
.profile-avatar:hover { transform: scale(1.06) rotate(4deg); box-shadow: 0 0 0 8px rgba(16,185,129,.09), 0 0 30px rgba(16,185,129,.22); }
.profile-info h2 { color: #fff; font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.profile-info p { color: var(--accent-green); font-family: monospace; font-weight: 600; font-size: 14px; }
.btn { padding: 12px 20px; font-weight: 700; font-size: 14px; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; transition: 0.2s; }
.btn-green { background: var(--accent-green); color: #000; width: 100%; }
.btn-green:hover { background: #34d399; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(16,185,129,.2); }
.btn-gray { background: var(--border); color: #fff; }
.btn-gray:hover { background: #3f3f46; transform: translateY(-2px); }

/* СТАТИСТИКА */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 16px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); padding: 19px 14px; text-align: center; border-radius: 16px; transition: transform .32s ease, border-color .32s ease, box-shadow .32s ease; animation: panelRise .55s cubic-bezier(.2,.8,.2,1) both; }
.stat-card:nth-child(2) { animation-delay: 70ms; } .stat-card:nth-child(3) { animation-delay: 140ms; } .stat-card:nth-child(4) { animation-delay: 210ms; } .stat-card:nth-child(5) { animation-delay: 280ms; } .stat-card:nth-child(6) { animation-delay: 350ms; }
.stat-card:hover { transform: translateY(-5px); border-color: rgba(16,185,129,.55); box-shadow: 0 10px 24px rgba(0,0,0,.22); }
.stat-icon { font-size: 25px; color: var(--text-muted); margin-bottom: 6px; display: block; }
.stat-value { font-family: monospace; font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 2px; }
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

/* ФОРМА */
.form-box { background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
.form-label { font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; display: block; }
.inp { width: 100%; padding: 14px; background: var(--bg-input); border: 1px solid var(--border); color: #fff; font-size: 15px; outline: none; border-radius: 10px; margin-bottom: 15px; }
.inp { transition: border-color .25s ease, box-shadow .25s ease, background .25s ease; }
.inp:focus { border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(16,185,129,.12); background: #0d0d10; }
.btn-row { display: flex; gap: 10px; }

/* ═══════ ИГРОВОЙ ЭКРАН ═══════ */
#game-screen { 
  position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; 
  display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px; 
}
#game-screen.active { display: flex; animation: screenFade .28s ease both; }
#game-screen.active .game-header { animation: headerDrop .48s cubic-bezier(.2,.8,.2,1) both; }
#game-screen.active .slot-container { animation: slotEntrance .62s cubic-bezier(.18,.8,.25,1) both; }
#game-screen.active .reel-window { animation: reelReveal .55s ease both; }
#game-screen.active .reel-window:nth-child(2) { animation-delay: 70ms; }
#game-screen.active .reel-window:nth-child(3) { animation-delay: 140ms; }

.game-header { 
  position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px; height: 60px; 
  background: var(--glass-bg); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 30px;
  display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-shadow: var(--shadow-main);
}
.back-btn-game { background: transparent; border: none; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; }
.back-btn-game:hover { color: #fff; background: rgba(255,255,255,0.05); }

.slot-container { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; width: 100%; max-width: 440px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); margin-top: 60px; }
.reels { background: #000; padding: 10px; border: 2px solid var(--border); display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; border-radius: 12px; position: relative; }
.reel-window { height: calc(var(--reel-h) * 3); background: #0a0a0a; position: relative; overflow: hidden; border-radius: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
.reel-strip { position: absolute; top: 0; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
.reel-item { height: var(--reel-h); width: 100%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.reel-item img { width: 80%; height: 80%; object-fit: contain; }
.reel-item.winning { background: rgba(16, 185, 129, 0.15); border: 2px solid var(--accent-green); border-radius: 8px; box-shadow: 0 0 15px rgba(16,185,129,0.4); z-index: 2; animation: winningPulse 1.1s ease-in-out infinite alternate; }

.game-controls { display: flex; flex-direction: column; gap: 15px; }
.bet-box { display: flex; align-items: center; justify-content: space-between; background: var(--bg-input); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); }
.bet-box span { color: var(--text-muted); font-weight: 600; }
.bet-box input { width: 100px; background: transparent; border: none; color: var(--accent-green); font-family: monospace; font-size: 20px; text-align: right; font-weight: 800; outline: none; }
.bet-btns { display: flex; gap: 8px; }
.bet-btns button { flex: 1; background: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 12px; cursor: pointer; font-weight: 700; border-radius: 10px; transition: 0.2s; }
.bet-btns button { transition: transform .22s ease, background .22s ease, border-color .22s ease; }
.bet-btns button:hover { background: var(--border); border-color: rgba(16,185,129,.45); transform: translateY(-2px); }
.bet-btns button:active, .btn:active, .back-btn:active, .play-btn:active { transform: scale(.97); }
.spin-btn-big { position: relative; overflow: hidden; background: linear-gradient(110deg, #10b981, #34d399, #10b981); background-size: 200% 100%; color: #000; border: none; padding: 16px; font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; border-radius: 12px; width: 100%; transition: transform .25s ease, box-shadow .3s ease, filter .3s ease; box-shadow: 0 4px 18px rgba(16,185,129,.25); animation: spinButtonGlow 4s ease-in-out infinite; }
.spin-btn-big:hover { filter: brightness(1.08); transform: translateY(-2px) scale(1.006); box-shadow: 0 9px 28px rgba(16,185,129,.38); }
.spin-btn-big:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; box-shadow: none; transform: none; animation: none; filter: none; }

/* ═══════ КРАСИВЫЙ ПОПАП ВЫИГРЫША ═══════ */
.win-popup { position: fixed; inset: 0; z-index: 10005; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
.win-popup.active { opacity: 1; pointer-events: auto; }
.win-box { 
  background: linear-gradient(135deg, #1e1e22 0%, #0a0a0b 100%); 
  border: 2px solid var(--accent-green); width: 90%; max-width: 320px; text-align: center; border-radius: 24px; 
  overflow: hidden; box-shadow: 0 0 60px rgba(16,185,129,0.4), inset 0 0 20px rgba(16,185,129,0.2); 
  transform: scale(0.8); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
}
.win-popup.active .win-box { transform: scale(1); }
.win-popup.mega .win-box { border-color: var(--accent-gold); box-shadow: 0 0 60px rgba(251,191,36,0.5), inset 0 0 20px rgba(251,191,36,0.2); }

.win-title { 
  background: var(--accent-green); color: #000; font-weight: 900; padding: 15px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px;
}
.win-popup.mega .win-title { background: var(--accent-gold); }

.win-amount { 
  padding: 30px 20px; font-size: 48px; font-weight: 900; font-family: monospace; color: #fff; 
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
  animation: popScale 0.5s ease-out;
}
@keyframes popScale { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }

/* Переходы между страницами */
.page-view { display: none; }
.page-view.active { display: block; animation: pageEnter .42s cubic-bezier(.2,.8,.2,1) both; }

/* Набор мягких микроанимаций Kesug Slots */
@keyframes ambientDrift { from { transform: translate3d(-1.5%, -1%, 0) scale(1); } to { transform: translate3d(1.5%, 1%, 0) scale(1.06); } }
@keyframes headerFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes headerSettle {
  0% { opacity: .76; transform: translateY(-9px) scale(.975); filter: blur(2px); }
  68% { opacity: 1; transform: translateY(1px) scale(1.006); filter: blur(0); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@keyframes headerGlassSweep {
  0%, 22% { transform: translateX(-135%) skewX(-16deg); }
  58%, 100% { transform: translateX(145%) skewX(-16deg); }
}
@keyframes headerGlassGlow { from { opacity: .55; } to { opacity: 1; } }
@keyframes headerLogoGlow {
  0%, 100% { filter: drop-shadow(0 0 6px rgba(16,185,129,.35)); }
  50% { filter: drop-shadow(0 0 13px rgba(16,185,129,.8)); }
}
@keyframes headerBalanceShine {
  0%, 34% { left: -55%; opacity: 0; }
  42% { opacity: .9; }
  62%, 100% { left: 125%; opacity: 0; }
}
@keyframes headerAvatarHalo {
  0%, 100% { box-shadow: 0 0 0 2px rgba(16,185,129,.04), 0 0 12px rgba(16,185,129,.07); }
  50% { box-shadow: 0 0 0 3px rgba(16,185,129,.10), 0 0 21px rgba(16,185,129,.17); }
}
@keyframes balancePop { 0% { transform: scale(1); } 35% { transform: scale(1.08); box-shadow: 0 0 0 5px rgba(16,185,129,.10); } 100% { transform: scale(1); } }
@keyframes cardEnter { from { opacity: 0; transform: translateY(22px) scale(.975); filter: blur(5px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
@keyframes cardSheen { 0% { left: -130%; } 100% { left: 150%; } }
@keyframes buttonSheen { to { transform: translateX(120%); } }
@keyframes panelRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pageEnter { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
@keyframes screenFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slotEntrance { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes reelReveal { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* Уважаем системную настройку уменьшения анимации. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
  html { scroll-behavior: auto; }
}

/* АДАПТИВ */

function getIconUrl(emoji) {
  return ICON_MAP[emoji] || 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Gem%20stone/3D/gem_stone_3d.png';
}

const state = {
  playerId: localStorage.getItem('kasino_player_id') || 'player_' + Math.random().toString(36).substr(2, 9),
  balance: parseFloat(localStorage.getItem('ks_balance')) || 1000,
  bet: 100,
  avatar: localStorage.getItem('ks_avatar') || '',
  nickname: localStorage.getItem('ks_nickname') || 'Игрок',
  stats: JSON.parse(localStorage.getItem('ks_stats')) || { spins: 0, won: 0, maxWin: 0, totalBet: 0 }
};
localStorage.setItem('kasino_player_id', state.playerId);

let currentMachine = null, isSpinning = false;

window.showPage = (id) => {
  document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('page-' + id);
  if (el) el.classList.add('active');

  if (id === 'profile') renderProfileStats();
  if (id === 'edit-profile') document.getElementById('input-nick').value = state.nickname;
};

function saveToLocal() {
  localStorage.setItem('ks_balance', state.balance);
  localStorage.setItem('ks_nickname', state.nickname);
  localStorage.setItem('ks_stats', JSON.stringify(state.stats));
  localStorage.setItem('ks_avatar', state.avatar);
}

function updateUI() {
  const fmt = Math.floor(state.balance).toLocaleString('ru-RU') + ' ₽';
  const balanceText = document.getElementById('ui-balance');
  const balanceWrap = document.getElementById('ui-balance-wrap');
  if (balanceText.textContent !== fmt) {
    balanceText.textContent = fmt;
    balanceWrap.classList.remove('balance-pop');
    void balanceWrap.offsetWidth;
    balanceWrap.classList.add('balance-pop');
  }
  document.getElementById('game-balance').textContent = fmt;
  const betInput = document.getElementById('game-bet');
  if (betInput && document.activeElement !== betInput) betInput.value = state.bet;
}

function updateProfileUI() {
  const defaultAvatar = 'https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Smiling%20face%20with%20sunglasses/3D/smiling_face_with_sunglasses_3d.png';
  const currentAvatar = state.avatar || defaultAvatar;
  
  document.getElementById('profile-big-avatar').src = currentAvatar;
  document.getElementById('nav-avatar').src = currentAvatar;
  
  document.getElementById('profile-big-nick').textContent = state.nickname;
  document.getElementById('profile-big-id').textContent = `ID: #${state.playerId.slice(-4).toUpperCase()}`;
}

function renderProfileStats() {
  document.getElementById('stat-spins').textContent = (state.stats.spins || 0).toLocaleString('ru-RU');
  document.getElementById('stat-bet').textContent = Math.floor(state.stats.totalBet || 0).toLocaleString('ru-RU') + ' ₽';
  document.getElementById('stat-won').textContent = Math.floor(state.stats.won || 0).toLocaleString('ru-RU') + ' ₽';
  document.getElementById('stat-maxwin').textContent = Math.floor(state.stats.maxWin || 0).toLocaleString('ru-RU') + ' ₽';
  document.getElementById('stat-balance').textContent = Math.floor(state.balance).toLocaleString('ru-RU') + ' ₽';
  
  const profit = (state.stats.won || 0) - (state.stats.totalBet || 0);
  const profitEl = document.getElementById('stat-profit');
  profitEl.textContent = (profit >= 0 ? '+' : '') + Math.floor(profit).toLocaleString('ru-RU') + ' ₽';
  profitEl.style.color = profit >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
}

function renderLobby() {
  const grid = document.getElementById('machine-grid');
  grid.innerHTML = MACHINES.map((m, index) => `
    <div class="game-card" style="--card-delay: ${Math.min(index * 42, 520)}ms" onclick="openMachine('${m.id}')">
      <img src="${getIconUrl(m.symbols[0])}" class="game-icon">
      <div class="game-title">${m.name}</div>
      <div class="game-desc">${m.desc}</div>
      <button class="play-btn">Играть</button>
    </div>
  `).join('');
}

window.saveProfile = () => {
  const v = document.getElementById('input-nick').value.trim();
  if (v) { state.nickname = v; saveToLocal(); updateProfileUI(); updateUI(); }
  showPage('profile');
};

document.getElementById('upload-avatar').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = (ev) => { state.avatar = ev.target.result; saveToLocal(); updateProfileUI(); };
  rd.readAsDataURL(f);
});

window.openMachine = (id) => {
  currentMachine = MACHINES.find(m => m.id === id);
  if (!currentMachine) return;
  
  for (let col = 0; col < 3; col++) {
    const strip = document.getElementById('reel-' + col);
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    strip.innerHTML = '';
    for (let row = 0; row < 3; row++) {
      const symbol = currentMachine.symbols[(col + row) % currentMachine.symbols.length];
      strip.innerHTML += `<div class="reel-item"><img src="${getIconUrl(symbol)}"></div>`;
    }
  }
  document.getElementById('game-screen').classList.add('active');
  document.body.style.overflow = 'hidden';
  updateUI();
};

window.closeMachine = () => {
  document.getElementById('game-screen').classList.remove('active');
  document.body.style.overflow = '';
  currentMachine = null;
  updateUI();
};

window.changeBet = (amt) => {
  if (isSpinning) return;
  state.bet = Math.max(10, Math.min(state.balance, state.bet + amt, 50000));
  document.getElementById('game-bet').value = state.bet;
};

window.maxBet = () => {
  if (isSpinning) return;
  state.bet = Math.min(state.balance, 50000);
  if (state.bet < 10) state.bet = 10;
  document.getElementById('game-bet').value = state.bet;
};

const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function generateResult(syms) {
  let result = Array.from({ length: 9 }, () => syms[Math.floor(Math.random() * syms.length)]);
  const hasAnyTriple = WIN_LINES.some(l => result[l[0]] === result[l[1]] && result[l[1]] === result[l[2]]);
  if (hasAnyTriple) return result;
  if (Math.random() < 0.15) {
    const line = WIN_LINES[Math.floor(Math.random() * WIN_LINES.length)];
    const s = syms[Math.floor(Math.random() * syms.length)];
    line.forEach(idx => result[idx] = s);
  }
  return result;
}

window.spin = () => {
  if (isSpinning || !currentMachine) return;
  if (state.balance < state.bet) { alert('Мало средств!'); return; }

  isSpinning = true;
  document.getElementById('btn-spin').disabled = true;
  
  state.balance -= state.bet;
  state.stats.spins++;
  state.stats.totalBet += state.bet;
  saveToLocal(); updateUI();
  document.querySelectorAll('.reel-item').forEach(el => el.classList.remove('winning'));

  const syms = currentMachine.symbols;
  const result = generateResult(syms);
  const reelHeight = document.querySelector('.reel-window').offsetHeight / 3;
  const ITEMS = 20;
  const DURATION = 1500;

  for (let col = 0; col < 3; col++) {
    const strip = document.getElementById('reel-' + col);
    let html = '';
    for (let k = 0; k < ITEMS; k++) html += `<div class="reel-item"><img src="${getIconUrl(syms[Math.floor(Math.random() * syms.length)])}"></div>`;
    html += `<div class="reel-item"><img src="${getIconUrl(result[col])}"></div>`;
    html += `<div class="reel-item"><img src="${getIconUrl(result[col + 3])}"></div>`;
    html += `<div class="reel-item"><img src="${getIconUrl(result[col + 6])}"></div>`;
    strip.innerHTML = html;
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
  }

  void document.body.offsetHeight;

  for (let col = 0; col < 3; col++) {
    const strip = document.getElementById('reel-' + col);
    strip.style.transition = `transform ${DURATION}ms cubic-bezier(0.1, 0.7, 0.1, 1) ${col * 200}ms`;
    strip.style.transform = `translateY(-${ITEMS * reelHeight}px)`;
  }

  setTimeout(() => { checkWin(result); }, DURATION + 400 + 100);
};

function checkWin(res) {
  let win = 0;
  const syms = currentMachine.symbols;
  let winningCells = new Set();

  WIN_LINES.forEach(l => {
    if (res[l[0]] === res[l[1]] && res[l[1]] === res[l[2]]) {
      win += state.bet * currentMachine.triple[syms.indexOf(res[l[0]])];
      l.forEach(idx => winningCells.add(idx));
    }
  });

  win = Math.floor(win);

  if (win > 0) {
    winningCells.forEach(idx => {
      const col = idx % 3, row = Math.floor(idx / 3);
      const strip = document.getElementById('reel-' + col);
      const items = strip.querySelectorAll('.reel-item');
      const targetItem = items[items.length - 3 + row];
      if (targetItem) targetItem.classList.add('winning');
    });

    state.balance += win;
    state.stats.won += win;
    if (win > state.stats.maxWin) state.stats.maxWin = win;
    saveToLocal(); updateUI();
    
    // Красивый показ выигрыша
    const isMega = win >= state.bet * 20;
    const popup = document.getElementById('win-popup');
    
    popup.classList.toggle('mega', isMega);
    document.getElementById('win-title').textContent = isMega ? 'MEGA WIN' : 'WIN';
    document.getElementById('win-amount').textContent = win.toLocaleString('ru-RU') + ' ₽';
    
    popup.classList.add('active');
    setTimeout(() => popup.classList.remove('active'), 2500);
  }

  isSpinning = false;
  document.getElementById('btn-spin').disabled = false;
}

// Плавное превращение верхней панели в стеклянную шапку.
const topHeader = document.querySelector('.top-header');
const HEADER_SCROLL_THRESHOLD = 28;
let headerScrollTicking = false;

function updateHeaderOnScroll() {
  topHeader.classList.toggle('is-scrolled', window.scrollY > HEADER_SCROLL_THRESHOLD);
  headerScrollTicking = false;
}

window.addEventListener('scroll', () => {
  if (!headerScrollTicking) {
    window.requestAnimationFrame(updateHeaderOnScroll);
    headerScrollTicking = true;
  }
}, { passive: true });
updateHeaderOnScroll();

// Более мягкая прокрутка колёсиком на компьютерах с мышью/тачпадом.
// На телефонах, при открытом игровом экране и при системном reduced-motion
// остаётся стандартное поведение браузера.
(() => {
  const desktopPointer = window.matchMedia('(min-width: 769px) and (pointer: fine)');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (!desktopPointer.matches || reduceMotion.matches) return;

  let targetScrollY = window.scrollY;
  let currentScrollY = window.scrollY;
  let scrollFrame = null;

  // Колёсико должно двигать страницу, а не запускать браузерный zoom.
  window.addEventListener('wheel', (event) => {
    if (event.ctrlKey || event.metaKey) return;
    if (document.getElementById('game-screen').classList.contains('active')) return;
    if (event.target.closest('input, textarea, select, [data-native-scroll]')) return;

    event.preventDefault();

    let delta = event.deltaY;
    if (event.deltaMode === 1) delta *= 16;
    else if (event.deltaMode === 2) delta *= window.innerHeight;

    const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    // Синхронизируем цель, если пользователь перед этим перетащил ползунок прокрутки.
    if (Math.abs(targetScrollY - window.scrollY) > window.innerHeight) {
      targetScrollY = window.scrollY;
      currentScrollY = window.scrollY;
    }
    targetScrollY = Math.max(0, Math.min(maxScroll, targetScrollY + delta * 1.08));

    if (scrollFrame === null) {
      currentScrollY = window.scrollY;
      scrollFrame = window.requestAnimationFrame(animateWheelScroll);
    }
  }, { passive: false });

  function animateWheelScroll() {
    const distance = targetScrollY - currentScrollY;
    currentScrollY += distance * 0.16;

    if (Math.abs(distance) < 0.65) {
      currentScrollY = targetScrollY;
      window.scrollTo({ top: currentScrollY, behavior: 'instant' });
      scrollFrame = null;
      return;
    }

    window.scrollTo({ top: currentScrollY, behavior: 'instant' });
    scrollFrame = window.requestAnimationFrame(animateWheelScroll);
  }
})();

// Инициализация
renderLobby();
updateUI();
updateProfileUI();
</script>
